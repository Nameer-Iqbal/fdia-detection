# LOW-NOISE SENSITIVITY VARIANT (generated from the v2 config; only the noise and file paths differ)
# Purpose: test whether conclusions depend on the deliberately conservative meter noise of the main study,
# where the injection-meter std (0.010 pu = 100 kW) is comparable to a typical bus load (~0.012 pu).
# ==============================================================================
# Configuration for Normal Dataset Generation (Dataset v2: Day-to-Day Load Variability)
# System: IEEE 33-Bus Radial Distribution System
# Base Power: 10.0 MVA, Base Voltage: 12.66 kV
# ==============================================================================

[system]
case_file = "data/cases/case33bw.m"
base_mva = 10.0
num_buses = 33
num_in_service_branches = 32

[dataset]
master_seed = 42
num_samples = 5000         # Full dataset size
num_dev_samples = 200      # Small development size
use_dev_size = false       # Toggle true to run N=200 dev size, false for full N=5000
samples_per_day = 24       # Hourly sampling cadence across 24h cycle

[operating_point]
# Global nominal load scaling range
# Upper bound 1.00 ensures with 5% day scaling and per-bus noise that min voltage stays >= 0.90 pu
load_factor_min = 0.60
load_factor_max = 1.00
# Independent per-bus Gaussian load perturbation std (constant power factor per bus)
per_bus_noise_std = 0.025

[daily_profile]
# Diurnal shape: smoothed triangular profile avoiding flat floor clipping
# Phase: peak at 20:00 (evening peak), trough at 08:00 (morning/night base)
peak_hour = 20.0
trough_hour = 8.0
smoothness = 0.96          # Smoothing parameter alpha in asin(alpha*sin(theta))

[day_variability]
# Day-level scale factor Gaussian std (mean 1.0)
day_scale_std = 0.05
# Day-level peak hour shift jitter range (+/- hours)
day_peak_jitter_max = 1.0

[state_estimation]
tolerance = 1e-8
max_iterations = 40
alpha_levels = [0.05, 0.01]
num_load_bins = 5

# Measurement noise standard deviations (in per-unit on 10 MVA base)
[noise]
# ~10x lower power-meter noise (10 kW / 8 kW on the 10 MVA base), 5x lower voltmeter noise (0.1% class)
voltmeter_std = 0.001
power_injection_active_std = 0.001
power_injection_reactive_std = 0.001
power_flow_active_std = 0.0008
power_flow_reactive_std = 0.0008

[output]
dataset_file = "data/normal_data_v2_lownoise.csv"
dev_dataset_file = "data/normal_dev_v2_lownoise.csv"
metadata_file = "data/normal_meta_v2_lownoise.json"
jacobian_file = "data/H_example_v2_lownoise.csv"
