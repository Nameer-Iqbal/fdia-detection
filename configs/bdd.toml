# ==============================================================================
# Bad Data Detection (BDD) Configuration & Calibration Thresholds
# System: IEEE 33-Bus Radial Feeder (m = 163 Measurements, n = 65 States, df = 98)
# Calibrated on N = 5000 Normal Operating Points
# ==============================================================================

[system]
num_measurements = 163
num_states = 65
degrees_of_freedom = 98

[chi_square]
# Chi-Square distribution critical values for df = 98:
# quantile(Chisq(98), 1 - alpha)
alpha_05_threshold = 122.1077
alpha_01_threshold = 133.4757

[largest_normalized_residual]
# Empirical quantiles on N = 5000 unattacked normal dataset:
# - 95th percentile (nominal 5.0% false alarm rate on normal data)
# - 99th percentile (nominal 1.0% false alarm rate on normal data)
empirical_threshold_05 = 3.6211
empirical_threshold_01 = 4.1078

# Bonferroni-style analytical thresholds for m = 163:
# tau_Bonf = Phi^-1(1 - alpha / (2 * m))
bonferroni_threshold_05 = 3.6095
bonferroni_threshold_01 = 4.0076

# Uncalibrated legacy textbook threshold (produces 33.60% false alarms on normal data):
legacy_threshold = 3.0

[range_check]
# Global voltage bounds observed in N = 5000 normal dataset:
voltage_min_normal = 0.9008926
voltage_max_normal = 1.0032777
