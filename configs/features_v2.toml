# ==============================================================================
# Feature Engineering & Dataset Split Configuration (Dataset v2)
# IEEE 33-Bus Radial Distribution System
# ==============================================================================

[general]
seed = 42
dataset_path = "data/attacks_full_v2.csv"
splits_output_path = "data/splits_v2.csv"
features_output_path = "data/features_v2.csv"
features_meta_output_path = "data/features_meta_v2.json"
h_matrix_path = "data/H_example_v2.csv"
case_path = "data/cases/case33bw.m"
bdd_config_path = "configs/bdd_v2.toml"
# Meter noise std devs: read from the [noise] section of the normal-data config (single source of truth)
noise_config = "configs/dataset_v2.toml"
# Output of julia/07_sensitivity_features.jl (leverage and Omega diagonals per row)
sensitivity_output_path = "data/sensitivity_features_v2.csv"
# Per-split feature matrices written by python/features.py ({split} = train / val / test)
features_split_template = "data/features_{split}_v2.csv"
# Distribution-aware (mimic) attack sets to featurise (see configs/mimic_attacks_v2.toml)
mimic_config = "configs/mimic_attacks_v2.toml"

[splits]
# Group-aware split ratios (by group_id, 5000 total groups)
train_ratio = 0.60
val_ratio = 0.20
test_ratio = 0.20

train_attack_types = [
    "random",
    "linearised_single_bus",
    "linearised_multi_bus"
]

held_out_attack_types = [
    "exact_ac_single_bus",
    "exact_ac_multi_bus",
    "limited_meter"
]

[features]
save_format = "csv"
